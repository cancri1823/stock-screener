<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">

<style>
:root{--bg:#eef1f4;--ink:#1b2430;--mut:#66727f;--card:#fff;--line:#d5dbe2;--red:#c8372d;--amb:#b9770e;--teal:#0f6b6b;--blue:#3b5b8c;--vio:#7a5c99;--ok:#1d7a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:18px 16px 10px;max-width:1100px;margin:auto}h1{margin:0;font-size:22px;letter-spacing:.04em}header p{margin:2px 0 0;color:var(--mut)}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>label{display:flex;gap:6px;align-items:center;color:var(--mut)}
input,select,textarea,button{font:inherit;color:inherit}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,th:focus-visible,tr:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
#mkt{display:none;border-left:4px solid var(--teal)}#mkt.hot{border-color:var(--red)}
#prog{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
#log{color:var(--mut);margin-top:6px;font-size:12px;min-height:18px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th{font-weight:600;text-align:left;padding:8px;border-bottom:2px solid var(--ink);cursor:pointer;white-space:nowrap;user-select:none}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.s{cursor:pointer}tr.s:hover td{background:#f6f8fa}
.bar{display:flex;height:10px;width:140px;background:#e6eaee;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%}

.r1{color:#fff;background:var(--red);border-color:var(--red)}.r2{color:var(--red);border-color:var(--red)}.r3{color:var(--mut)}.r4{color:#9aa4ae}
.sig{color:var(--ok);border-color:#b7dcc6;background:#f1faf5}.wrn{color:var(--amb);border-color:#ecd3a5;background:#fff8ea}
.det td{background:#fafbfc;padding:12px 14px}.det h4{margin:10px 0 4px;font-size:13px}.det ul{margin:0;padding:0;list-style:none}.det li{padding:1px 0}
.y{color:var(--ok)}.n{color:var(--red)}.mut{color:var(--mut)}.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 14px}
.chips{margin-top:8px;min-height:30px}.chips .tag{background:#fff;font-size:13px;padding:2px 4px 2px 9px}.chips .tag button{background:none;border:0;color:var(--mut);padding:0 4px;font-size:15px;line-height:1}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:0 0 8px;flex-wrap:wrap}.lg b{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
</style></head><body>
<header><h1>選股 · 四維聯動</h1><p>基本面是主人，籌碼與技術面是狗。資料來源 FinMind，在瀏覽器內直接計算。</p></header>
<main>
<div class="panel">
 <div class="row">
  <label>FinMind Token <input id="tok" type="password" size="22" placeholder="登入後取得，可留空"></label>
  <label>基本面可未通過 <select id="mf"><option>0</option><option>1</option><option>2</option><option>3</option></select> 項</label>
  <label><input type="checkbox" id="ng"> 不淘汰，全部評分</label>
  <label><input type="checkbox" id="nc"> 忽略快取</label>
 </div>
 <div class="row" style="margin-top:10px"><input id="sid" type="text" list="sl" size="28" placeholder="輸入代號或名稱，例如 2330" aria-label="股票代號或名稱" autocomplete="off"><datalist id="sl"></datalist><button id="add" class="ghost">加入</button><button id="clr" class="ghost">清空</button></div><div id="chips" class="chips"></div>
 <div class="row" style="margin-top:10px"><button id="go">開始篩選</button><button id="stop" class="ghost" disabled>停止</button>
  <button class="ghost" id="exj">匯出 JSON</button><button class="ghost" id="exc">匯出 CSV</button></div>
 <div id="prog"><i></i></div><div id="log">逐一加入股票後按「開始篩選」。額度用盡時按下停止或等待，稍後再執行會接續(已處理者有快取)。</div>
</div>
<div class="panel" id="mkt"></div>
<div class="panel" id="out" style="display:none">
 <div class="row" style="margin-bottom:8px"><label>評級 <select id="fl"><option value="">全部</option><option>強烈關注</option><option>關注</option><option>觀察</option><option>略過</option></select></label><span id="cnt" class="mut"></span></div>
 <div class="lg"><span><b style="background:var(--red)"></b>基本面 40</span><span><b style="background:var(--blue)"></b>估值 20</span><span><b style="background:var(--teal)"></b>籌碼 20</span><span><b style="background:var(--vio)"></b>技術 20</span></div>
 <div class="wrap"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main>
<script>
const API='https://api.finmindtrade.com/api/v4/data',$=s=>document.querySelector(s);
const CFG={eps:3,epsY:5,gm:30,roe:15,re:40,core:.5,fcfY:3,ocf:.5,peC:12,pbC:1,peT:18,peS:40,mp:140,me:130};
const HARD=['eps','gm','roe','reinvest','fcf','core','ocf_ni'],SOFT=['three_up'];
const LBL={eps:'連5年EPS>3',gm:'毛利率>30%',roe:'5年均ROE>15%',reinvest:'盈再率<40%',fcf:'自由現金流為正',core:'本業獲利為主',ocf_ni:'盈餘品質(OCF/淨利)',three_up:'三率三升'};
const CYC=new Set(['航運業','鋼鐵工業','塑膠工業','化學工業','水泥工業','造紙工業','玻璃陶瓷','紡織纖維','橡膠工業']),DRAM=new Set(['2408','2344','2337','8299','3260']);
const CF_CUM=true; // FinMind 現金流量表為年初至今累計；若實測為單季值請改 false
const DEF='2330 2317 2454 2308 2382 2412 2881 2882 2891 2886 2884 2885 2892 1301 1303 2002 1216 2912 3711 2357 2379 3008 3034 3045 4938 5871 5880 6505 2327 2395 2301 2207 1101 1102 2603 2609 2615 2801 2880 2883 2887 2890 3037 3231 3017 2345 6669 2383 2368 2376 2353 1590 9910 2049 2059 6415 3661 3443 5876 2408 2344';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),iso=d=>d.toISOString().slice(0,10),ago=n=>iso(new Date(Date.now()-n*864e5));
class RateErr extends Error{}
const LS={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let results=[],stopFlag=false,sortK='total',sortD=-1;

async function fm(ds,id,start){
 const p=new URLSearchParams({dataset:ds});if(id)p.set('data_id',id);if(start)p.set('start_date',start);
 const t=$('#tok').value.trim();if(t)p.set('token',t);
 let r,j;try{r=await fetch(API+'?'+p);j=await r.json()}catch(e){return[]}
 if(r.status===402||j.status===402)throw new RateErr();
 await sleep(250);return j.status===200?(j.data||[]):[];
}
// ---------- 資料處理
function ser(rows,ex,ct){const g={};for(const r of rows)(g[r.type]??=[]).push(r);
 let k=ex.find(e=>g[e])||Object.keys(g).find(c=>ct.some(x=>c.toLowerCase().includes(x)));
 return k?g[k].map(r=>({d:r.date,v:+r.value})).sort((a,b)=>a.d<b.d?-1:1):[]}
const ann=s=>{const g={};s.forEach(x=>(g[x.d.slice(0,4)]??=[]).push(x.v));const o={};for(const y in g)if(g[y].length>=4)o[y]=g[y].reduce((a,b)=>a+b,0);return o};
const ye=s=>{const o={};s.filter(x=>x.d.slice(5,7)==='12').forEach(x=>o[x.d.slice(0,4)]=x.v);return o};
const tl=(o,n)=>Object.entries(o).slice(-n),mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const dv=(a,b,f=1)=>{const o={};for(const y in a)if(b[y])o[y]=a[y]/b[y]*f;return o};
const qr=(a,b)=>{const m=new Map(b.map(x=>[x.d,x.v]));return a.filter(x=>m.get(x.d)).map(x=>x.v/m.get(x.d))};
const ck=(ok,d)=>({pass:!!ok,detail:d}),f1=x=>(+x).toFixed(1),R=(x,n=2)=>x==null||!isFinite(x)?null:+(+x).toFixed(n);
const sma=(a,n)=>a.map((_,i)=>i<n-1?NaN:mean(a.slice(i-n+1,i+1)));

// ---------- 第一維：基本面
function s1(fin){const C={},m={};
 const rev=ser(fin,['Revenue'],['revenue']),gp=ser(fin,['GrossProfit'],['grossprofit']),op=ser(fin,['OperatingIncome'],['operatingincome']),
  pt=ser(fin,['PreTaxIncome'],['pretax']),ni=ser(fin,['IncomeAfterTaxes'],['incomeaftertax']),eps=ser(fin,['EPS'],['eps']);
 m.niA=ann(ni);m.epsQ=eps;m.epsTtm=eps.length>=4?R(eps.slice(-4).reduce((a,b)=>a+b.v,0)):null;
 const ea=ann(eps),e5=tl(ea,CFG.epsY);m.epsA=ea;
 C.eps=e5.length<CFG.epsY?ck(0,`財報不足${CFG.epsY}年(僅${e5.length}年)`):ck(e5.every(e=>e[1]>CFG.eps),'EPS '+e5.map(e=>f1(e[1])).join(' / '));
 const gmA=dv(ann(gp),ann(rev),100),g5=tl(gmA,CFG.epsY);m.gmA=gmA;
 C.gm=g5.length?ck(g5.every(e=>e[1]>CFG.gm),'毛利率 '+g5.map(e=>f1(e[1])).join(' / ')+'%'):ck(0,'資料不足');
 const oa=tl(ann(op),3),pa=ann(pt);
 if(oa.length<3||oa.some(e=>!pa[e[0]]))C.core=ck(0,'營業利益/稅前淨利資料不足');
 else{const rt=oa.map(e=>e[1]/pa[e[0]]);C.core=ck(oa.every(e=>e[1]>0)&&rt.every(x=>x>=CFG.core),'營益/稅前 '+rt.map(x=>x.toFixed(2)).join(' / '))}
 const ups=[gp,op,ni].map(a=>{const q=qr(a,rev);return q.length>=5&&q.at(-1)>q.at(-5)});
 C.three_up=ck(ups.every(Boolean),`毛利/營益/淨利率 YoY 上升: ${ups.map(u=>u?'是':'否').join('/')}`);
 return[m,C]}
function s2(m,C,bs,cf){
 const eq=ye(ser(bs,['EquityAttributableToOwnersOfParent','Equity'],['equity'])),roe={};
 for(const y in m.niA)if(eq[y]){const p=eq[y-1];roe[y]=m.niA[y]/(p?(eq[y]+p)/2:eq[y])*100}
 const r5=tl(roe,CFG.epsY);m.roeA=roe;
 C.roe=r5.length<3?ck(0,'ROE資料不足'):ck(mean(r5.map(e=>e[1]))>CFG.roe,'ROE '+r5.map(e=>f1(e[1])).join(' / ')+'% 均'+f1(mean(r5.map(e=>e[1]))));
 const pk=(ex,ct)=>{const s=ser(cf,ex,ct);return CF_CUM?ye(s):ann(s)};
 const ocf=pk(['CashFlowsFromOperatingActivities','NetCashInflowFromOperatingActivities','CashFlowsFromUsedInOperatingActivities'],['operatingactivities']),
  icf=pk(['CashProvidedByInvestingActivities','CashFlowsFromInvestingActivities','NetCashInflowFromInvestingActivities'],['investingactivities']),
  cap=pk(['PropertyAndPlantAndEquipment'],['propertyandplantandequipment']);m.ocfY=ocf;
 const base=Object.keys(cap).length?cap:icf,re={};for(const y in base)if(m.niA[y])re[y]=Math.abs(base[y])/m.niA[y]*100;
 const re5=tl(re,5);m.reAvg=re5.length?R(mean(re5.map(e=>e[1])),0):null;
 C.reinvest=re5.length>=3?ck(mean(re5.map(e=>e[1]))<CFG.re&&mean(re5.map(e=>e[1]))>=0,'盈再率 '+re5.map(e=>f1(e[1])).join(' / ')+'%'):ck(0,'資本支出資料不足');
 const fc={};for(const y in ocf)if(y in icf)fc[y]=ocf[y]+icf[y];const f3=tl(fc,CFG.fcfY);
 C.fcf=f3.length>=CFG.fcfY?ck(f3.every(e=>e[1]>0),'FCF(百萬) '+f3.map(e=>(e[1]/1e6).toFixed(0)).join(' / ')):ck(0,'現金流資料不足');
 const ys=Object.keys(ocf).filter(y=>m.niA[y]);
 C.ocf_ni=ys.length?ck(ocf[ys.at(-1)]/m.niA[ys.at(-1)]>=CFG.ocf,'OCF/淨利 '+(ocf[ys.at(-1)]/m.niA[ys.at(-1)]).toFixed(2)):ck(0,'盈餘品質資料不足')}
function risk(m,cyc){const w=[],o=tl(m.ocfY||{},2);
 if(o.length==2&&o.every(e=>e[1]<0))w.push('地雷：營業現金流連2年為負');
 if(cyc)return w;
 const d3=(o,n)=>{const s=tl(o,3).map(e=>e[1]);if(s.length==3&&s[0]>s[1]&&s[1]>s[2])w.push(`地雷：${n}連3年下滑`)};
 d3(m.gmA,'毛利率');d3(m.roeA||{},'ROE');d3(m.epsA,'EPS');
 const r=tl(m.roeA||{},1);if(r.length&&r[0][1]<CFG.roe)w.push(`壞了：最新年度ROE ${f1(r[0][1])}% < ${CFG.roe}%`);
 const e=m.epsQ.map(x=>x.v);if(e.length>=6&&e.at(-1)<e.at(-5)&&e.at(-2)<e.at(-6))w.push('壞了：EPS連2季YoY衰退');return w}

// ---------- 第二維：估值
function valuation(per,cyc,pos,eps){let pe=null,pb=null,sg=[],wn=[],sc=0;
 if(per.length){const l=per.sort((a,b)=>a.date<b.date?-1:1).at(-1);pe=R(l.PER);pb=R(l.PBR)}
 const v={pe,pb};
 if(cyc){const lh=(eps!=null&&eps<=0)||(pe!=null&&(pe==0||pe>=25));
  if(lh&&pos!=null&&pos<=.25){sg.push('景氣循環股：獲利低谷+股價低檔(逆勢買區)');sc=18}
  else if(pe>0&&pe<=8){wn.push('景氣循環股：PE極低(獲利高峰)，留意賣出時機');sc=2}else sc=8;return[v,sg,wn,sc]}
 if(!(pe>0))return[v,sg,['估值：無有效PE(虧損或缺資料)'],0];
 if(pe<=CFG.peC){sg.push(`便宜價：PE ${pe} ≤ ${CFG.peC}`);sc=20}else if(pe<=15)sc=14;else if(pe<=CFG.peT)sc=8;
 else if(pe<=CFG.peS){sc=3;wn.push(`昂貴：PE ${pe} > ${CFG.peT}，波段可分批停利`)}else wn.push(`貴了：PE ${pe} > ${CFG.peS}，長線賣出訊號`);
 if(pb>0&&pb<=CFG.pbC){sg.push(`便宜價：PBR ${pb} ≤ ${CFG.pbC}`);sc=Math.min(20,sc+4)}
 return[v,sg,wn,sc]}

// ---------- 第三維：籌碼
function chips(inst,hold){const sg=[],wn=[],d={};let sc=0;
 if(inst.length){const G={外資:['Foreign_Investor','Foreign_Dealer_Self'],投信:['Investment_Trust']},D={};
  for(const k in G){D[k]={};inst.filter(x=>G[k].includes(x.name)).forEach(x=>D[k][x.date]=(D[k][x.date]||0)+x.buy-x.sell)}
  const last=(o,n)=>Object.keys(o).sort().slice(-n).map(k=>o[k]),fn=last(D.外資,10).reduce((a,b)=>a+b,0),tn=last(D.投信,10).reduce((a,b)=>a+b,0);
  d.foreign10=Math.round(fn/1000);d.trust10=Math.round(tn/1000);let st=0;for(const v of last(D.投信,99).reverse()){if(v>0)st++;else break}d.trustStreak=st;
  if(st>=3){sg.push(`投信連買 ${st} 日`);sc+=6}
  if(fn>0&&tn>0){sg.push('雙資合擊：外資、投信同步買超');sc+=10}else if(fn>0||tn>0)sc+=3;
  if((fn>0&&tn<0)||(tn>0&&fn<0)){wn.push('土洋對作：外資與投信方向相反');sc-=4}}
 const big=hold.filter(h=>String(h.HoldingSharesLevel).includes('1,000,001')&&!String(h.HoldingSharesLevel).includes('-'));
 if(big.length){const g={};big.forEach(h=>g[h.date]=(g[h.date]||0)+h.percent);const s=Object.keys(g).sort().map(k=>g[k]);
  if(s.length>=3){const c=s.at(-1)-s[Math.max(0,s.length-5)];d.bigPct=R(s.at(-1));d.bigChg4w=R(c);
   if(c>.3){sg.push(`千張大戶持股 4 週 +${c.toFixed(2)}%，籌碼集中`);sc+=6}else if(c<-.3){wn.push(`千張大戶持股 4 週 ${c.toFixed(2)}%，籌碼鬆動`);sc-=3}}}
 return[d,sg,wn,Math.max(0,Math.min(20,sc))]}

// ---------- 第四維：技術面
function tech(px){const sg=[],wn=[];let sc=0;
 if(px.length<245)return[{},sg,['技術面：價格資料不足245日'],0,null];
 px.sort((a,b)=>a.date<b.date?-1:1);const c=px.map(x=>+x.close),v=px.map(x=>+x.Trading_Volume),n=c.length,L=c[n-1];
 const m5=sma(c,5),m10=sma(c,10),m30=sma(c,30),m60=sma(c,60),m240=sma(c,240),i=n-1;
 if(L>=m240[i]&&m240[i]>=m240[i-20]){sg.push('站上年線且年線上揚(多方)');sc+=4}
 if(L<m60[i]){wn.push('收盤跌破季線(MA60)：停利/出場訊號');sc-=4}
 else if(m60[i]>=m60[i-5]&&L/m60[i]-1<=.03){sg.push('回檔至上揚季線獲支撐(波段買點)');sc+=8}
 const t=[m5[i],m10[i],m30[i]],sp=Math.max(...t)/Math.min(...t)-1,flat=Math.abs(m30[i]/m30[i-10]-1)<.02;
 const vr=v[i]/mean(v.slice(-21,-1)),y250=c.slice(-250).slice().sort((a,b)=>a-b),med=y250[125];
 if(sp<.03&&flat&&L<=med&&vr>=2&&L/c[i-1]-1>=.03){sg.push('三線托底：均線黏合+爆量大漲(安全買點)');sc+=8}
 const v60=sma(v,60),surge=v.slice(-40).some((x,k)=>x>=2*v60[n-40+k]);
 if(surge&&mean(v.slice(-5))<=.5*v60[i]&&L>=m60[i]*.95){sg.push('回檔坑：放量建倉後量縮洗盤(水靜河飛)');sc+=6}
 const y=c.slice(-875),N=y.length,xm=(N-1)/2,ym=mean(y);let sxy=0,sxx=0;y.forEach((q,k)=>{sxy+=(k-xm)*(q-ym);sxx+=(k-xm)**2});
 const b=sxy/sxx,a=ym-b*xm,res=y.map((q,k)=>q-(a+b*k)),sd=Math.sqrt(mean(res.map(r=>r*r))),z=sd?res[N-1]/sd:0,tr=a+b*(N-1);
 if(z<=-2){sg.push(`五線譜：股價在 -2σ 以下 (z=${z.toFixed(2)})，超賣極端區`);sc+=8}
 else if(z<=-1){sg.push(`五線譜：股價低於 -1σ (z=${z.toFixed(2)})`);sc+=4}
 else if(z>=2){wn.push(`五線譜：股價突破 +2σ (z=${z.toFixed(2)})，分批賣出區`);sc-=3}
 const pos=c.slice(-250).filter(q=>q<=L).length/250;
 return[{close:R(L),ma60:R(m60[i]),ma240:R(m240[i]),z:R(z),m2sd:R(tr-2*sd),p2sd:R(tr+2*sd)},sg,wn,Math.max(0,Math.min(20,sc)),pos]}

// ---------- 單檔
async function analyze(id,info,chain,o){
 const [name,ind,mk]=info[id]||[id,'',''],cyc=CYC.has(ind)||DRAM.has(id),Y=new Date().getFullYear()-7+'-01-01';
 const nf=C=>HARD.filter(k=>C[k]&&!C[k].pass).length;
 const fin=await fm('TaiwanStockFinancialStatements',id,Y);if(!fin.length)return['nofin'];
 let[m,C]=s1(fin);if(!cyc&&!o.ng&&nf(C)>o.mf)return['gate'];
 const bs=await fm('TaiwanStockBalanceSheet',id,Y),cf=await fm('TaiwanStockCashFlowsStatement',id,Y);s2(m,C,bs,cf);
 if(!cyc&&!o.ng&&nf(C)>o.mf)return['gate'];
 const per=await fm('TaiwanStockPER',id,ago(20)),px=await fm('TaiwanStockPrice',id,ago(1300)),
  inst=await fm('TaiwanStockInstitutionalInvestorsBuySell',id,ago(45)),hold=await fm('TaiwanStockHoldingSharesPer',id,ago(60));
 px.sort((a,b)=>a.date<b.date?-1:1);const lp=px.at(-1),pp=px.at(-2),[T,ts,tw,tsc,pos]=tech(px),[V,vs,vw,vsc]=valuation(per,cyc,pos,m.epsTtm),[H,cs,cw,csc]=chips(inst,hold),rk=risk(m,cyc);
 const ks=[...HARD,...SOFT].filter(k=>C[k]),fs=cyc?20:40*ks.filter(k=>C[k].pass).length/Math.max(1,ks.length);
 const tot=Math.max(0,fs+vsc+csc+tsc-5*rk.filter(w=>w.startsWith('地雷')).length);
 return['ok',{id,name,ind,mk,chain:(chain[id]||[]).join('、'),price:lp?R(lp.close):null,chg:lp&&pp?R((lp.close/pp.close-1)*100):null,pdate:lp?lp.date:null,cyc,total:R(tot,1),f:R(fs,1),v:vsc,c:csc,t:tsc,rating:tot>=75?'強烈關注':tot>=60?'關注':tot>=45?'觀察':'略過',
  sig:[...vs,...cs,...ts],warn:[...rk,...vw,...cw,...tw],val:V,chip:H,tech:T,reAvg:m.reAvg,epsTtm:m.epsTtm,checks:C}]}

async function marketMargin(){try{const d=await fm('TaiwanTotalExchangeMarginMaintenance',null,ago(15));if(!d.length)return null;
 const l=d.sort((a,b)=>a.date<b.date?-1:1).at(-1),k=Object.keys(l).find(k=>k!=='date'&&isFinite(+l[k])&&l[k]!=='');return k?R(+l[k]):null}catch(e){if(e instanceof RateErr)throw e;return null}}

// ---------- 主流程
async function infoMap(){let c=LS.g('info2');if(c&&Date.now()-c.t<6048e5)return c.m;
 try{const rows=await fm('TaiwanStockInfo'),m={};rows.forEach(r=>{if(/^\d{4}$/.test(r.stock_id)&&!m[r.stock_id])m[r.stock_id]=[r.stock_name,r.industry_category,r.type]});
  if(Object.keys(m).length)LS.s('info2',{t:Date.now(),m});return m}catch(e){return c?c.m:{}}}
async function chainMap(){let c=LS.g('chain');if(c&&Date.now()-c.t<6048e5)return c.m;
 try{const rows=await fm('TaiwanStockIndustryChain'),m={};rows.forEach(r=>{const t=[r.industry,r.sub_industry].filter(Boolean).join('/');if(!t)return;const a=m[r.stock_id]??=[];if(!a.includes(t))a.push(t)});
  if(Object.keys(m).length)LS.s('chain',{t:Date.now(),m});return m}catch(e){return c?c.m:{}}}
function log(t,p){$('#log').textContent=t;if(p!=null)$('#prog i').style.width=p+'%'}
async function run(){
 const ids=[...list];if(!ids.length)return log('請先加入至少一檔股票');
 LS.s('tok',$('#tok').value.trim());const o={mf:+$('#mf').value,ng:$('#ng').checked,nc:$('#nc').checked};
 $('#go').disabled=true;$('#stop').disabled=false;stopFlag=false;results=[];$('#out').style.display='none';
 try{log('讀取股票資料…',0);const info=await infoMap(),chain=await chainMap();
  const mm=await marketMargin();if(mm!=null){const e=$('#mkt');e.style.display='block';e.className='panel'+(mm<=CFG.mp?' hot':'');
   e.innerHTML=`大盤整戶融資維持率 <b>${mm}%</b> ${mm<=CFG.me?'· 極度恐慌，中長線逆勢低接區':mm<=CFG.mp?'· 恐慌，留意黃金坑':'· 正常'}`}
  const st={ok:0,gate:0,nofin:0};
  for(let i=0;i<ids.length&&!stopFlag;i++){const id=ids[i];log(`${i+1}/${ids.length} 分析 ${id} ${(info[id]||[''])[0]}　通過 ${st.ok}　淘汰 ${st.gate}`,i/ids.length*100);
   const rc=LS.g('res2:'+id),fc=LS.g('fail:'+id);
   if(!o.nc&&rc&&Date.now()-rc.t<864e5){results.push(rc.r);st.ok++;continue}
   if(!o.nc&&fc&&Date.now()-fc.t<6048e5&&fc.mf===o.mf&&!o.ng){st.gate++;continue}
   const[s,r]=await analyze(id,info,chain,o);st[s]=(st[s]||0)+1;
   if(s==='ok'){results.push(r);LS.s('res2:'+id,{t:Date.now(),r})}else if(s==='gate')LS.s('fail:'+id,{t:Date.now(),mf:o.mf})}
  log(`完成：通過 ${st.ok} 檔，基本面淘汰 ${st.gate} 檔${stopFlag?'（已手動停止）':''}`,100)
 }catch(e){log(e instanceof RateErr?'FinMind 額度用盡，已顯示目前結果。稍後再按「開始篩選」會接續(已處理者有快取)。':'發生錯誤：'+e.message)}
 $('#go').disabled=false;$('#stop').disabled=true;render()}

// ---------- 顯示
const COLS=[['id','代號 / 名稱'],['price','現價'],['ind','類股'],['chain','產業別'],['total','總分'],['f','基'],['v','估'],['c','籌'],['t','技'],['rating','評級'],['pe','PE'],['n','訊號']];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const key=(r,k)=>k==='pe'?(r.val.pe??1e9):k==='n'?r.sig.length:r[k];
function render(){const fl=$('#fl').value;let rows=results.filter(r=>!fl||r.rating===fl);
 rows.sort((a,b)=>{const x=key(a,sortK),y=key(b,sortK);return(x>y?1:x<y?-1:0)*sortD});
 $('#out').style.display=results.length?'block':'none';$('#cnt').textContent=`${rows.length} / ${results.length} 檔`;
 $('#hd').innerHTML=COLS.map(([k,t])=>`<th tabindex="0" data-k="${k}">${t}${k===sortK?(sortD>0?' ▲':' ▼'):''}</th>`).join('');
 $('#tb').innerHTML=rows.map(r=>`<tr class="s" tabindex="0" data-id="${r.id}"><td><b>${r.id}</b> ${esc(r.name)}${r.cyc?' <span class="tag">循環股</span>':''}</td>
 <td>${r.price??'—'}<br><span class="${r.chg>0?'n':r.chg<0?'y':'mut'}">${r.chg!=null?(r.chg>0?'+':'')+r.chg+'%':''}</span></td><td>${esc(r.ind||'—')}<br><span class="mut" style="font-size:12px">${({twse:'上市',tpex:'上櫃'})[r.mk]||''}</span></td><td class="mut" style="font-size:12px;max-width:190px">${esc(r.chain||'—')}</td>
 <td><span class="sc">${r.total}</span></td><td>${r.f}</td><td>${r.v}</td><td>${r.c}</td><td>${r.t}</td>
 <td><span class="tag r${['強烈關注','關注','觀察','略過'].indexOf(r.rating)+1}">${r.rating}</span></td><td>${r.val.pe??'—'}</td>
 <td>${r.sig.length?`<span class="tag sig">${r.sig.length} 訊號</span>`:''}${r.warn.length?`<span class="tag wrn">${r.warn.length} 警示</span>`:''}</td></tr>
 <tr class="det" id="d${r.id}" hidden><td colspan="12">${detail(r)}</td></tr>`).join('')}
function bar(r){return`<div class="bar" title="基${r.f} 估${r.v} 籌${r.c} 技${r.t}"><i style="width:${r.f/100*100}%;background:var(--red)"></i><i style="width:${r.v}%;background:var(--blue)"></i><i style="width:${r.c}%;background:var(--teal)"></i><i style="width:${r.t}%;background:var(--vio)"></i></div>`}
function detail(r){const kv=(o,m)=>Object.entries(m).map(([k,t])=>o[k]!=null?`<span><span class="mut">${t}</span> ${o[k]}</span>`:'').join('');
 return`${bar(r)}<h4>訊號與警示</h4>${r.sig.map(s=>`<span class="tag sig">${esc(s)}</span>`).join('')}${r.warn.map(s=>`<span class="tag wrn">${esc(s)}</span>`).join('')||''}${r.sig.length+r.warn.length?'':'<span class="mut">無</span>'}
 <h4>基本面檢核</h4><ul>${Object.keys(r.checks).map(k=>`<li><span class="${r.checks[k].pass?'y':'n'}">${r.checks[k].pass?'✓':'✗'}</span> ${LBL[k]||k}　<span class="mut">${esc(r.checks[k].detail)}</span></li>`).join('')}</ul>
 <h4>數據</h4><div class="kv">${kv(r.val,{pe:'PE',pb:'PBR'})}${kv(r.chip,{foreign10:'外資10日(張)',trust10:'投信10日(張)',trustStreak:'投信連買(日)',bigPct:'千張大戶%',bigChg4w:'大戶4週變化%'})}${kv(r.tech,{close:'收盤',ma60:'季線',ma240:'年線',z:'五線譜z',m2sd:'-2σ價',p2sd:'+2σ價'})}${kv(r,{epsTtm:'近4季EPS',reAvg:'盈再率%',pdate:'報價日'})}</div>`}
$('#tb').onclick=e=>{const t=e.target.closest('tr.s');if(t){const d=$('#d'+t.dataset.id);d.hidden=!d.hidden}};
$('#tb').onkeydown=e=>{if(e.key==='Enter')e.target.click?.()};
$('#hd').onclick=e=>{const k=e.target.closest('th')?.dataset.k;if(!k)return;sortD=k===sortK?-sortD:(['id','pe','ind','chain'].includes(k)?1:-1);sortK=k;render()};
$('#fl').onchange=render;$('#go').onclick=run;$('#stop').onclick=()=>stopFlag=true;
const dl=(n,t,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:mime}));a.download=n;a.click()};
$('#exj').onclick=()=>dl('screener.json',JSON.stringify({generated:new Date().toISOString(),stocks:results},null,1),'application/json');
$('#exc').onclick=()=>dl('screener.csv','\ufeff'+['代號,名稱,現價,漲跌%,類股,產業別,總分,基本面,估值,籌碼,技術,評級,PE,PBR,訊號,警示',...results.map(r=>[r.id,r.name,r.price,r.chg,r.ind,r.chain,r.total,r.f,r.v,r.c,r.t,r.rating,r.val.pe,r.val.pb,r.sig.join(' | '),r.warn.join(' | ')].map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(','))].join('\n'),'text/csv');
let list=LS.g('list')||[],INFO={};
function drawList(){LS.s('list',list);$('#chips').innerHTML=list.map(id=>`<span class="tag">${id} ${esc((INFO[id]||[''])[0])}<button data-x="${id}" aria-label="移除 ${id}">×</button></span>`).join('')||'<span class="mut">尚未加入股票</span>'}
function addStock(){const v=$('#sid').value.trim();if(!v)return;let id=(v.match(/^\d{4}/)||[])[0];
 if(!id)id=Object.keys(INFO).find(k=>INFO[k][0]===v)||Object.keys(INFO).find(k=>INFO[k][0].includes(v));
 if(!id)return log(`找不到「${v}」，請輸入 4 碼股票代號或股票名稱`);
 if(Object.keys(INFO).length&&!INFO[id])return log(`${id} 不在上市櫃股票清單中`);
 if(list.includes(id))return log(`${id} 已在清單中`);list.push(id);$('#sid').value='';drawList();log(`已加入 ${id} ${(INFO[id]||[''])[0]}`);$('#sid').focus()}
$('#add').onclick=addStock;$('#sid').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addStock()}};
$('#clr').onclick=()=>{list=[];drawList()};$('#chips').onclick=e=>{const x=e.target.dataset.x;if(x){list=list.filter(i=>i!==x);drawList()}};
$('#tok').value=LS.g('tok')||'';drawList();
infoMap().then(m=>{INFO=m;$('#sl').innerHTML=Object.keys(m).map(k=>`<option value="${k} ${esc(m[k][0])}">`).join('');drawList()});
</script></body></html>
