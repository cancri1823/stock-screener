<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選股戰情室</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e6e8ee;--mut:#8b93a5;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5b942;--acc:#5b8def}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Noto Sans TC",sans-serif;padding:16px;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar input[type=number],.bar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:6px 8px;border-radius:6px;width:90px}
.bar label{color:var(--mut);font-size:13px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{background:var(--card);color:var(--mut);font-weight:500;cursor:pointer;position:sticky;top:0;user-select:none}
th.on{color:var(--acc)}
tr.row{cursor:pointer}
tr.row:hover{background:#1c2029}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}
.t-ok{background:#12352a;color:var(--ok)}.t-no{background:#3a1c1c;color:var(--bad)}.t-na{background:#22262f;color:var(--mut)}
.score{font-weight:700}
.det td{background:#141720;white-space:normal;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--acc)}
.it{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.it b{color:var(--ok)}.it i{color:var(--mut);font-style:normal}
.flag{color:var(--warn);font-size:12px;margin-top:6px}
.veto{color:var(--bad);font-size:12px;margin-top:6px}
.kv{color:var(--mut);font-size:12px;margin-top:6px}
#drop{border:2px dashed var(--line);border-radius:8px;padding:30px;text-align:center;color:var(--mut);display:none}
#drop.show{display:block}
</style>
</head>
<body>
<h1>📈 選股戰情室</h1>
<div class="sub" id="meta">載入中…</div>

<div id="drop">找不到 screener_result.json<br>請把檔案拖曳到這裡，或 <button class="btn" id="pick">選擇檔案</button>
<input type="file" id="file" accept=".json" hidden></div>

<div id="app" hidden>
  <div class="bar">
    <label>最低總分 <input type="number" id="minScore" value="0" min="0" max="100"></label>
    <label><input type="checkbox" id="onlyOk"> 只看入選</label>
    <label><input type="checkbox" id="hideVeto"> 隱藏否決</label>
    <input type="text" id="q" placeholder="代號搜尋" style="width:110px">
    <button class="btn" id="csv">匯出 CSV</button>
    <button class="btn" id="load2">載入其他 JSON</button>
  </div>
  <div class="wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
</div>

<script>
const COLS=[["代號","l"],["總分"],["基本面"],["籌碼面"],["技術面"],["結果","l"],["ROE"],["PE"],["毛利率"],["投信連買天數"],["月線乖離%"]];
let DATA=null,sortKey="總分",sortDir=-1,open=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function init(){
  try{const r=await fetch("screener_result.json?t="+Date.now());if(!r.ok)throw 0;setData(await r.json());}
  catch{$("meta").textContent="尚未載入資料";$("drop").classList.add("show");}
}
function setData(d){DATA=d;$("drop").classList.remove("show");$("app").hidden=false;
  $("meta").textContent=`更新時間 ${d.updated}　·　入選門檻 ${d.pass_score} 分　·　共 ${d.rows.length} 檔`;
  $("minScore").value=0;render();}
function readFile(f){const fr=new FileReader();fr.onload=()=>{try{setData(JSON.parse(fr.result))}catch{alert("JSON 格式錯誤")}};fr.readAsText(f);}

function render(){
  $("head").innerHTML=COLS.map(([c,l])=>`<th class="${l||""} ${c==sortKey?"on":""}" data-k="${c}">${c}${c==sortKey?(sortDir<0?" ▼":" ▲"):""}</th>`).join("");
  const min=+$("minScore").value||0,ok=$("onlyOk").checked,hv=$("hideVeto").checked,q=$("q").value.trim();
  let rows=DATA.rows.filter(r=>r.總分>=min&&(!ok||r.結果.includes("入選"))&&(!hv||!r.結果.includes("否決"))&&(!q||r.代號.includes(q)));
  rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return (x==null)-(y==null)||(x>y?1:x<y?-1:0)*sortDir;});
  $("body").innerHTML=rows.map(r=>{
    const cls=r.結果.includes("入選")?"t-ok":r.結果.includes("否決")?"t-no":"t-na";
    const cells=COLS.map(([c,l])=>{
      let v=r[c]; if(v==null)v="–";
      if(c=="結果")v=`<span class="tag ${cls}">${esc(v)}</span>`;
      else if(c=="總分")v=`<span class="score" style="color:${r.總分>=DATA.pass_score?"var(--ok)":"var(--tx)"}">${v}</span>`;
      else v=esc(v);
      return `<td class="${l||""}">${v}</td>`;}).join("");
    return `<tr class="row" data-id="${esc(r.代號)}">${cells}</tr>`+(open==r.代號?detail(r):"");
  }).join("")||`<tr><td colspan="${COLS.length}" class="l">沒有符合條件的股票</td></tr>`;
}

function detail(r){
  const d=DATA.detail[r.代號]||{};
  const maxes={基本面:100,籌碼面:100,技術面:100};
  const boxes=Object.entries(d).map(([k,items])=>`<div class="box"><h4>${k}　${r[k]}/100</h4>`+
    Object.entries(items).map(([n,p])=>`<div class="it"><span>${esc(n)}</span>${p>0?`<b>+${p}</b>`:`<i>0</i>`}</div>`).join("")+`</div>`).join("");
  const skip=new Set(["代號","總分","基本面","籌碼面","技術面","結果","否決原因","警示"]);
  const kv=Object.entries(r).filter(([k,v])=>!skip.has(k)&&v!=null).map(([k,v])=>`${esc(k)}：${esc(v)}`).join("　·　");
  return `<tr class="det"><td colspan="${COLS.length}"><div class="grid">${boxes}</div>`+
    (r.否決原因?`<div class="veto">⛔ ${esc(r.否決原因)}</div>`:"")+
    (r.警示?`<div class="flag">⚠ ${esc(r.警示)}</div>`:"")+
    `<div class="kv">${kv}</div></td></tr>`;
}

function toCSV(){
  const keys=[...new Set(DATA.rows.flatMap(r=>Object.keys(r)))];
  const lines=[keys.join(",")].concat(DATA.rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"}));
  a.download="screener_result.csv";a.click();
}

$("head").addEventListener("click",e=>{const k=e.target.dataset.k;if(!k)return;sortDir=sortKey==k?-sortDir:-1;sortKey=k;render();});
$("body").addEventListener("click",e=>{const tr=e.target.closest("tr.row");if(!tr)return;open=open==tr.dataset.id?null:tr.dataset.id;render();});
["minScore","onlyOk","hideVeto","q"].forEach(id=>$(id).addEventListener("input",render));
$("csv").onclick=toCSV;
$("pick").onclick=$("load2").onclick=()=>$("file").click();
$("file").onchange=e=>e.target.files[0]&&readFile(e.target.files[0]);
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();e.dataTransfer.files[0]&&readFile(e.dataTransfer.files[0]);});
init();
</script>
</body>
</html>
